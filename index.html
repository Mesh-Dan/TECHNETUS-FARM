/* TECHNESTUS FARM ERP BRAND THEME */
:root {
  --dark: #4F8A3D;
  --gold: #FFD93D;
  --bg: #F5FBEF;
  --line: #CFE7BF;
  --primary: #FFD93D;
  --secondary: #A8D98B;
}

/* Main background */
body {
  background: #F5FBEF !important;
  color: #25351B !important;
}

/* Header */
header {
  background: #4F8A3D !important;
  color: #FFFFFF !important;
  border-bottom: 4px solid #FFD93D !important;
}

header h1,
header small {
  color: #FFFFFF !important;
}

#cloudStatus {
  color: #FFF2A6 !important;
}

/* Sidebar */
aside {
  background: #DDF2CE !important;
  border-right: 2px solid #A8D98B !important;
}

nav button,
#nav button {
  background: transparent !important;
  color: #25351B !important;
  font-weight: 600;
  border-radius: 8px;
}

nav button:hover,
#nav button:hover {
  background: #A8D98B !important;
  color: #25351B !important;
}

nav button.active,
#nav button.active {
  background: #FFD93D !important;
  color: #25351B !important;
  font-weight: 700;
}

/* Dashboard cards */
.card {
  background: #FFFFFF !important;
  border: 1px solid #CFE7BF !important;
  border-left: 5px solid #A8D98B !important;
  border-radius: 12px;
}

.card strong {
  color: #4F8A3D !important;
}

.card small {
  color: #607455 !important;
}

/* Content panels */
.panel {
  background: #FFFFFF !important;
  border: 1px solid #CFE7BF !important;
  border-radius: 12px;
}

/* Main buttons */
button {
  background: #FFD93D;
  color: #25351B;
}

button:hover {
  background: #EFC82D;
}

button.secondary {
  background: #E5F5DB !important;
  color: #25351B !important;
  border: 1px solid #A8D98B;
}

button.danger {
  background: #B83B3B !important;
  color: #FFFFFF !important;
}

/* Tables */
table {
  background: #FFFFFF;
}

th {
  background: #DDF2CE !important;
  color: #25351B !important;
}

td {
  border-bottom: 1px solid #D7E9C9;
}

tbody tr:nth-child(even) {
  background: #F5FBEF;
}

tbody tr:hover {
  background: #EBF7E2;
}

/* Form inputs */
input,
select,
textarea {
  background: #FFFFFF;
  border: 1px solid #A8D98B !important;
  color: #25351B;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #FFD93D;
  border-color: #4F8A3D !important;
}

/* Login screen */
#authGate {
  background: linear-gradient(
    135deg,
    #A8D98B,
    #F5FBEF,
    #FFD93D
  ) !important;
}

#authGate .authbox {
  background: #FFFFFF !important;
  border: 2px solid #A8D98B;
  border-radius: 15px;
}

#authGate button {
  background: #FFD93D !important;
  color: #25351B !important;
}

/* Information notices */
.note {
  background: #FFF8D6 !important;
  color: #25351B !important;
  border-left: 4px solid #FFD93D;
}

/* Headings */
main h2,
main h3 {
  color: #25351B !important;
}

/* Badges */
.badge {
  background: #E5F5DB !important;
  color: #32652A !important;
}

/* Printable documents */
.dochead {
  border-bottom: 3px solid #FFD93D !important;
}

/* Preserve print layout */
@media print {
  header,
  aside {
    display: none !important;
  }
}
/* END TECHNESTUS FARM ERP BRAND THEME */

const names={dashboard:'▦ Dashboard',incubators:'♨ Incubators',eggs:'🥚 Egg batches',hatches:'🐣 Hatchery',brooding:'🐥 Brooding',birds:'🐓 Bird stock',mortality:'＋ Mortality',customers:'♙ Customers',sales:'🛒 Sales',expenses:'↘ Expenses',investors:'♧ Investors',investments:'▤ Agreements',repayments:'↗ Repayments',invoices:'▧ Invoices',receipts:'▥ Receipts',reports:'◫ Reports',settings:'⚙ Data & settings'};
function nav(){document.getElementById('nav').innerHTML=Object.entries({...names,users:'🔐 Users & permissions'}).filter(([k])=>canView(k)).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}

function birdAge(hatchDate) {
  if (!hatchDate) return 'Set hatch date';

  const [year, month, day] = hatchDate.split('-').map(Number);

  const hatch = new Date(year, month - 1, day);
  const today = new Date();

  hatch.setHours(0, 0, 0, 0);
  today.setHours(0, 0, 0, 0);

  const days = Math.round(
    (Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) -
     Date.UTC(hatch.getFullYear(), hatch.getMonth(), hatch.getDate())) /
    86400000
  );

  if (!Number.isFinite(days)) return 'Invalid hatch date';
  if (days < 0) return 'Not yet hatched';

  const weeks = Math.floor(days / 7);
  const remainingDays = days % 7;

  return `${days} days (${weeks} weeks, ${remainingDays} days)`;
}

function cell(k,r) {
  if (k === 'age') {
    return esc(birdAge(r.hatchDate));
  }

  let v = r[k];

  if ([
    'amount','principal','interest','totalPayable',
    'outstanding','unitPrice','unitCost','feedCost',
    'medCost','otherCost','total','cogs','paid',
    'balance','principalPaid','interestPaid'
  ].includes(k)) {
    return cash(v);
  }

  if (k === 'rate') return (v || 0) + '%';

  return esc(v);
}

function editRecord(p,id){if(!canWrite(p))return alert('Access denied');form(p,db[p].find(r=>r.id===id))}
function form(p,r){let s=schemas[p];openModal((r?'Edit ':'New ')+s.title,`<form onsubmit="submitRecord(event,'${p}',${r?.id||0})"><div class="fields">${s.fields.map(f=>fieldHTML(f,r)).join('')}</div><div class="toolbar" style="margin-top:18px"><button>Save record</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`)}
function submitRecord(e,p,recordId){e.preventDefault();if(!canWrite(p))return alert('Access denied');let obj=Object.fromEntries(new FormData(e.target));for(let f of schemas[p].fields)if(f[2]==='number')obj[f[0]]=Number(obj[f[0]]||0);if(p==='investors'&&db.investors.some(x=>x.investorId===obj.investorId&&x.id!==recordId))return alert('Investor ID already exists.');if(p==='investments'&&db.investments.some(x=>x.agreementId===obj.agreementId&&x.id!==recordId))return alert('Agreement ID already exists.');if(p==='hatches'){obj.transferDate=plus(obj.setDate,18);obj.hatchDate=plus(obj.setDate,21);obj.rate=obj.eggsSet?Math.round(obj.hatched/obj.eggsSet*1000)/10:0}if(p==='sales'){obj.total=obj.quantity*obj.unitPrice;obj.cogs=obj.quantity*obj.unitCost;obj.balance=obj.total-obj.paid}if(p==='investments'){obj.interest=obj.interestType==='Fixed amount'?obj.interestValue:obj.interestType==='Fixed percentage'?obj.principal*obj.interestValue/100:obj.principal*obj.interestValue/100*obj.termMonths/12;obj.totalPayable=obj.principal+obj.interest}if(p==='repayments'){obj.amount=obj.principalPaid+obj.interestPaid;if(!db.investments.some(x=>x.agreementId===obj.agreementId))return alert('Select a valid investment agreement.');obj.investorId=db.investments.find(x=>x.agreementId===obj.agreementId).investorId}if(p==='invoices'){obj.number=(db.invoices.find(x=>x.id===recordId)||{}).number||'TINV-'+new Date().getFullYear()+'-'+String(db.invoices.length+1).padStart(4,'0');obj.amount=Math.max(0,obj.quantity*obj.unitPrice-obj.discount);obj.status='Issued'}if(p==='receipts'){obj.number=(db.receipts.find(x=>x.id===recordId)||{}).number||'TRC-'+new Date().getFullYear()+'-'+String(db.receipts.length+1).padStart(4,'0')}
if(recordId){let i=db[p].findIndex(x=>x.id===recordId);db[p][i]={...db[p][i],...obj}}else db[p].push({...obj,id:uid()});recalculate();save();closeModal();render()}
function recalculate(){for(let inv of db.investments){let pay=db.repayments.filter(x=>x.agreementId===inv.agreementId);inv.outstanding=Math.max(0,inv.totalPayable-sum(pay,'amount'));inv.status=inv.outstanding===0?'Repaid':inv.dueDate<today()?'Overdue':'Outstanding'}}
function removeRecord(p,id){if(!canWrite(p))return alert('Access denied');if(!confirm('Permanently delete this record from this browser?'))return;db[p]=db[p].filter(x=>x.id!==id);recalculate();save();render()}
function openModal(t,html){document.getElementById('mtitle').textContent=t;document.getElementById('mbody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function printDoc(p,id){let r=db[p].find(x=>x.id===id),kind=p==='invoices'?'INVOICE':p==='receipts'?'RECEIPT':'INVESTOR REPAYMENT';let lines=p==='invoices'?`<p>Item: ${esc(r.item)} · Quantity: ${r.quantity} · Unit price: ${cash(r.unitPrice)}</p>`:p==='receipts'?`<p>Invoice: ${esc(r.invoice)} · Method: ${esc(r.method)} · Transaction: ${esc(r.reference)}</p>`:`<p>Agreement: ${esc(r.agreementId)} · Investor ID: ${esc(r.investorId)}</p><p>Principal paid: ${cash(r.principalPaid)} · Interest paid: ${cash(r.interestPaid)}</p>`;openModal(kind,`<div class="doc"><div class="dochead"><div><h2>TECHNESTUS</h2><p>INVESTMENT FARM<br>Possibilities Ahead</p></div><div class="right"><h2>${kind}</h2><p>${esc(r.number||r.paymentId)}</p><p>Date: ${esc(r.date)}</p></div></div><p>${p==='repayments'?'Investor':'Customer'}: ${esc(r.customer||r.investorId)}</p>${lines}<h2 class="right">Total: ${cash(r.amount)}</h2><p>Thank you for your business.</p></div><div class="toolbar noprint"><button onclick="window.print()">Print / Save PDF</button></div>`)}
function reports(m){let sales=sum(db.sales,'total'),cogs=sum(db.sales,'cogs'),expenses=sum(db.expenses,'amount'),capital=sum(db.investments,'principal'),repay=sum(db.repayments,'amount');m.innerHTML=`<div class="head"><div><h2>Financial and farm reports</h2><div class="muted">Based on entered records</div></div><button onclick="backup()">Export JSON</button></div><div class="panel"><h3>Operations</h3><table>${[['Sales',cash(sales)],['Cost of goods sold',cash(cogs)],['Other operating expenses',cash(expenses)],['Indicative operating result',cash(sales-cogs-expenses)],['Hatched chicks',sum(db.hatches,'hatched')],['Recorded mortality',sum(db.mortality,'quantity')]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table></div><div class="panel"><h3>Investor financing (separate from revenue)</h3><table>${[['Capital received',cash(capital)],['Agreed total interest',cash(sum(db.investments,'interest'))],['Repayments made',cash(repay)],['Remaining obligations',cash(sum(db.investments,'outstanding'))]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table></div><div class="note">These figures are management estimates, not audited statements. Invoice and sale records may overlap; invoiced sales are not automatically posted into the sales ledger.</div>`}
function settings(m){m.innerHTML=`<div class="head"><h2>Data and settings</h2></div><div class="panel"><h3>Backup and restore</h3><p>Data stays in this browser profile, including when offline. Back up to a safe place frequently.</p><div class="toolbar"><button onclick="backup()">Download JSON backup</button><button class="secondary" onclick="document.getElementById('restore').click()">Restore JSON backup</button><button class="danger" onclick="discardPending()">Discard pending sync</button><input type="file" id="restore" accept=".json" hidden onchange="restore(event)"></div></div><div class="panel"><h3>Deployment limitations</h3><p>This is a functional single-device ERP starter. It does not yet have secure Admin/Employee login, server database, synchronization across employees, cloud backups, or audit trails. Do not use it as the sole record for sensitive investor information until those features are deployed.</p></div>`}
function backup(){if(!canWrite('settings'))return alert('Admin only');download(JSON.stringify(db,null,2),'technestus-farm-erp-backup.json','application/json')}
function download(s,name,type){let url=URL.createObjectURL(new Blob([s],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportCSV(p){let rows=db[p];if(!rows.length)return alert('No records to export');let keys=[...new Set(rows.flatMap(Object.keys))];download(keys.join(',')+'\n'+rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(',')).join('\n'),p+'.csv','text/csv')}
function restore(e){if(!canWrite('settings'))return alert('Admin only');let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!confirm('Replace ALL local data with this backup?'))return;db=data;for(let t of types)db[t]??=[];recalculate();save();render();alert('Restored successfully')}catch(err){alert('Invalid backup file')}};reader.readAsText(f)}

// Accounting module: locally persisted double-entry journal and derived operational postings.
const ACCOUNT_LIST=[
['1000','Cash on hand','Asset'],['1010','Bank / M-Pesa','Asset'],['1100','Trade receivables','Asset'],['1200','Egg and poultry inventory','Asset'],['1300','Equipment and incubators','Asset'],['1400','Prepaid expenses','Asset'],
['2000','Trade payables','Liability'],['2100','Investor principal payable','Liability'],['2110','Investor interest payable','Liability'],['2200','Other loans','Liability'],
['3000','Owner capital','Equity'],['3100','Owner drawings','Equity'],
['4000','Poultry and egg sales','Income'],['4100','Other operating income','Income'],
['5000','Cost of poultry sold','Expense'],['5100','Feed and supplies','Expense'],['5200','Medication','Expense'],['5300','Transport','Expense'],['5400','Labour','Expense'],['5500','Utilities','Expense'],['5600','Rent','Expense'],['5700','Other operating expense','Expense'],['5800','Investor interest expense','Expense']];
if(!db.journals)db.journals=[];if(!db.payables)db.payables=[];if(!db.accountSettings)db.accountSettings={};
const acctMap=Object.fromEntries(ACCOUNT_LIST.map(a=>[a[0],a]));
function jline(date,source,description,dr,cr,amount,reference=''){amount=Number(amount)||0;return amount>0?{date,source,description,dr,cr,amount,reference}:null}
function operatingJournal(){let out=[];let add=(...args)=>{let v=jline(...args);if(v)out.push(v)};
for(let r of db.sales){let d=r.date||today();add(d,'Sale',r.item,'1100','4000',r.total,'SALE-'+r.id);add(d,'Sale receipt',r.item,'1010','1100',r.paid,'SALE-'+r.id);add(d,'Cost of sale',r.item,'5000','1200',r.cogs,'SALE-'+r.id)}
for(let r of db.expenses){let code=({'Feed':'5100','Medication':'5200','Transport':'5300','Labour':'5400','Utilities':'5500','Rent':'5600','Equipment':'1300'}[r.category]||'5700');add(r.date||today(),'Expense',r.description,code,'1010',r.amount,r.reference)}
for(let r of db.investments){add(r.receivedDate||today(),'Investment received',r.agreementId,'1010','2100',r.principal,r.agreementId);add(r.receivedDate||today(),'Agreed interest',r.agreementId,'5800','2110',r.interest,r.agreementId)}
for(let r of db.repayments){add(r.date||today(),'Principal repayment',r.agreementId,'2100','1010',r.principalPaid,r.paymentId);add(r.date||today(),'Interest repayment',r.agreementId,'2110','1010',r.interestPaid,r.paymentId)}
for(let r of db.payables){add(r.date||today(),'Supplier bill',r.description,r.account||'5700','2000',r.amount,r.billId);for(let payment of (r.payments||[]))add(payment.date||today(),'Supplier payment',r.description,'2000','1010',payment.amount,r.billId)}
// Invoices are booked only when not represented by a matching recorded sale; avoid duplicate revenue.
for(let r of db.invoices){if(db.sales.some(x=>x.invoice===r.number))continue;add(r.date||today(),'Invoice',r.item,'1100','4000',r.amount,r.number)}
for(let r of db.receipts){if(!r.invoice)continue;let invoice=db.invoices.find(x=>x.number===r.invoice);if(invoice&&!db.sales.some(x=>x.invoice===r.invoice))add(r.date||today(),'Invoice receipt',r.invoice,'1010','1100',r.amount,r.number)}
return out}
function ledger(){return [...operatingJournal(),...db.journals.flatMap(r=>(r.lines||[]).filter(l=>Number(l.debit||0)>0||Number(l.credit||0)>0).map(l=>({date:r.date,source:'Manual journal',description:r.description,account:l.account,debit:Number(l.debit)||0,credit:Number(l.credit)||0,reference:r.reference||''})))].flatMap(x=>x.account?[x]:[{...x,account:x.dr,debit:x.amount,credit:0},{...x,account:x.cr,debit:0,credit:x.amount}]).sort((a,b)=>(a.date||'').localeCompare(b.date||''))}
function balances(end){let a=Object.fromEntries(ACCOUNT_LIST.map(x=>[x[0],{debit:0,credit:0}]));for(let x of ledger()){if(end&&x.date>end)continue;if(!a[x.account])continue;a[x.account].debit+=Number(x.debit)||0;a[x.account].credit+=Number(x.credit)||0}return a}
function balance(a,k){return (a[k]?.debit||0)-(a[k]?.credit||0)}
function sumsByType(a,type){return ACCOUNT_LIST.filter(x=>x[2]===type).reduce((t,x)=>t+balance(a,x[0]),0)}
function accountingNav(){if(!canView('accounting'))return;let n=document.getElementById('nav');n.insertAdjacentHTML('beforeend',`<button class="${page==='accounting'?'active':''}" onclick="go('accounting')">▤ Accounting</button><button class="${page==='journals'?'active':''}" onclick="go('journals')">≡ Journal entries</button><button class="${page==='payables'?'active':''}" onclick="go('payables')">↘ Supplier bills</button>`)}
const oldNav=nav;nav=function(){oldNav();accountingNav()};
const oldRender=render;render=function(){if(!sessionUser)return;if(page==='accounting'){if(!canView('accounting'))return;nav();return accountingPage()}if(page==='journals'){if(!canView('journals'))return;nav();return journalPage()}if(page==='payables'){if(!canView('payables'))return;nav();return payablePage()}oldRender()};
function accountingPage(){let a=balances(),as=sumsByType(a,'Asset'),li=-sumsByType(a,'Liability'),eq=-sumsByType(a,'Equity'),inc=-sumsByType(a,'Income'),ex=sumsByType(a,'Expense'),profit=inc-ex,all=ledger(),debits=all.reduce((s,x)=>s+x.debit,0),credits=all.reduce((s,x)=>s+x.credit,0);
let cashbal=balance(a,'1000')+balance(a,'1010');let rows=ACCOUNT_LIST.map(([code,name,type])=>{let dr=a[code].debit-a[code].credit;return `<tr><td>${code}</td><td>${esc(name)}</td><td>${type}</td><td>${cash(Math.max(0,dr))}</td><td>${cash(Math.max(0,-dr))}</td></tr>`}).join('');
let lines=all.slice().reverse().slice(0,200).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.reference)}</td><td>${esc(x.description)}</td><td>${esc(x.account)} · ${esc(acctMap[x.account]?.[1]||'')}</td><td>${cash(x.debit)}</td><td>${cash(x.credit)}</td></tr>`).join('');
let section=(title,arr)=>`<h3>${title}</h3><table><tr><th>Account</th><th>Balance</th></tr>${arr.map(([k,n,v])=>`<tr><td>${k} · ${esc(n)}</td><td>${cash(v)}</td></tr>`).join('')}</table>`;
let accountRows=t=>ACCOUNT_LIST.filter(x=>x[2]===t).map(([k,n])=>[k,n,(t==='Asset'||t==='Expense'?1:-1)*balance(a,k)]);
let html=`<div class="head"><div><h2>Accounting & financial position</h2><div class="muted">Double-entry ledger · All values in KSh · Accrual-based overview</div></div><div class="toolbar"><button onclick="go('journals')">＋ Journal entry</button><button class="secondary" onclick="exportLedger()">Export ledger</button></div></div><div class="cards">${[['Cash & bank',cash(cashbal)],['Total assets',cash(as)],['Liabilities',cash(li)],['Current period-to-date profit',cash(profit)],['Owner equity',cash(eq)],['Receivables',cash(balance(a,'1100'))],['Supplier payables',cash(-balance(a,'2000'))],['Investor liabilities',cash(-balance(a,'2100')-balance(a,'2110'))]].map(([k,v])=>`<div class="card"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div>
<div class="panel">${section('Income statement',accountRows('Income').concat(accountRows('Expense')))}<p><b>Revenue:</b> ${cash(inc)} · <b>Expenses:</b> ${cash(ex)} · <b>Net result:</b> ${cash(profit)}</p></div>
<div class="panel">${section('Statement of financial position — Assets',accountRows('Asset'))}${section('Liabilities',accountRows('Liability'))}${section('Equity',accountRows('Equity'))}<p><b>Assets:</b> ${cash(as)} · <b>Liabilities + owner equity + current earnings:</b> ${cash(li+eq+profit)}</p></div>
<div class="panel"><h3>Trial balance</h3><div class="scroll"><table><tr><th>Code</th><th>Account</th><th>Type</th><th>Debit</th><th>Credit</th></tr>${rows}<tr><th colspan="3">TOTAL</th><th>${cash(ACCOUNT_LIST.reduce((s,[k])=>s+Math.max(0,balance(a,k)),0))}</th><th>${cash(ACCOUNT_LIST.reduce((s,[k])=>s+Math.max(0,-balance(a,k)),0))}</th></tr></table></div></div>
<div class="panel"><h3>Cash flow overview</h3><p>Cash & bank movement from posted records: <b>${cash(cashbal)}</b>. This represents recorded net cash movement, not a reconciled cash-flow statement. Add opening balances using journal entries.</p></div>
<div class="panel"><h3>General ledger — recent 200 lines</h3><div class="scroll"><table><tr><th>Date</th><th>Reference</th><th>Description</th><th>Account</th><th>Debit</th><th>Credit</th></tr>${lines||'<tr><td colspan="6">No entries.</td></tr>'}</table></div></div>
<div class="note">Accounting controls: Sale records create receivables, sales revenue, collections and cost of goods sold. Expense records post cash payments. Investor capital is a liability, not revenue. Interest is accrued immediately based on the agreement total, which may differ from your contractual accounting treatment. Invoices without sales links are posted as receivables and income; enter invoice numbers in sales records to prevent duplicates. Opening balances, inventory adjustments, depreciation and reconciliation require manual journal entries. Figures are provisional until reviewed by an accountant.</div>`;document.getElementById('main').innerHTML=html}
function journalPage(){let rows=db.journals.slice().reverse().map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.reference)}</td><td>${esc(r.description)}</td><td>${(r.lines||[]).map(l=>esc(l.account)+' D:'+cash(l.debit)+' C:'+cash(l.credit)).join('<br>')}</td><td><button class="danger" onclick="deleteJournal(${r.id})">Delete</button></td></tr>`).join('');document.getElementById('main').innerHTML=`<div class="head"><div><h2>Manual journal entries</h2><div class="muted">Post balanced double-entry transactions</div></div><button onclick="newJournal()">＋ New journal</button></div><div class="panel scroll"><table><tr><th>Date</th><th>Reference</th><th>Description</th><th>Lines</th><th>Action</th></tr>${rows||'<tr><td colspan="5">No journals yet</td></tr>'}</table></div>`}
function newJournal(){if(!canWrite('journals'))return alert('Access denied');let options=ACCOUNT_LIST.map(([k,n])=>`<option value="${k}">${k} · ${n}</option>`).join('');openModal('New double-entry journal',`<form onsubmit="saveJournal(event)"><div class="fields"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Reference</label><input name="reference" required></div><div class="field wide"><label>Description</label><input name="description" required></div><div class="field"><label>Debit account</label><select name="debitAccount">${options}</select></div><div class="field"><label>Credit account</label><select name="creditAccount">${options}</select></div><div class="field wide"><label>Amount (KSh)</label><input name="amount" type="number" min="0.01" step="0.01" required></div></div><div class="toolbar" style="margin-top:15px"><button>Post journal</button></div></form><div class="note">Use journal entries for opening balances, capital contributions, asset acquisitions, inventory adjustments, depreciation and accruals. Each entry posts equal debit and credit amounts.</div>`)}
function saveJournal(e){e.preventDefault();if(!canWrite('journals'))return alert('Access denied');let x=Object.fromEntries(new FormData(e.target));if(x.debitAccount===x.creditAccount)return alert('Debit and credit accounts must be different');let amt=Number(x.amount);if(!(amt>0))return alert('Enter positive amount');db.journals.push({id:uid(),date:x.date,reference:x.reference,description:x.description,lines:[{account:x.debitAccount,debit:amt,credit:0},{account:x.creditAccount,debit:0,credit:amt}]});save();closeModal();render()}
function deleteJournal(id){if(confirm('Delete this journal entry?')){db.journals=db.journals.filter(x=>x.id!==id);save();render()}}
function payablePage(){document.getElementById('main').innerHTML=`<div class="head"><div><h2>Supplier bills / Accounts payable</h2><div class="muted">Unpaid and partially paid bills</div></div><button onclick="newPayable()">＋ New supplier bill</button></div><div class="panel scroll"><table><tr><th>Bill ID</th><th>Supplier</th><th>Due date</th><th>Amount</th><th>Paid</th><th>Outstanding</th><th>Action</th></tr>${db.payables.map(x=>`<tr><td>${esc(x.billId)}</td><td>${esc(x.supplier)}</td><td>${esc(x.dueDate)}</td><td>${cash(x.amount)}</td><td>${cash(x.paid)}</td><td>${cash(x.amount-x.paid)}</td><td><button class="secondary" onclick="payBill(${x.id})">Record payment</button></td></tr>`).join('')||'<tr><td colspan="7">No bills recorded.</td></tr>'}</table></div>`}
function newPayable(){if(!canWrite('payables'))return alert('Access denied');openModal('Record supplier bill',`<form onsubmit="savePayable(event)"><div class="fields">${[['billId','Bill ID','text'],['supplier','Supplier','text'],['date','Bill date','date'],['dueDate','Due date','date'],['description','Description','text'],['amount','Bill amount (KSh)','number']].map(([k,l,t])=>`<div class="field"><label>${l}</label><input name="${k}" type="${t}" ${t==='date'?`value="${today()}"`:''} required></div>`).join('')}</div><button style="margin-top:15px">Save bill</button></form>`)}
function savePayable(e){e.preventDefault();if (!canWrite('payables'))return alert('Access denied');let x=Object.fromEntries(new FormData(e.target));x.amount=Number(x.amount);x.paid=0;x.account='5700';x.id=uid();db.payables.push(x);save();closeModal();render()}
function payBill(id){if(!canWrite('payables'))return alert('Access denied');let x=db.payables.find(r=>r.id===id);if(!x)return;openModal('Pay supplier bill',`<form onsubmit="saveBillPayment(event,${id})"><div class="fields"><div class="field"><label>Payment date</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>Payment amount (max ${cash(x.amount-x.paid)})</label><input name="amount" type="number" min="0.01" max="${x.amount-x.paid}" step="0.01" required></div></div><button style="margin-top:15px">Record payment</button></form>`)}
function saveBillPayment(e,id){e.preventDefault();if(!canWrite('payables'))return alert('Access denied');let x=db.payables.find(r=>r.id===id),v=Object.fromEntries(new FormData(e.target)),amount=Number(v.amount);if(amount<=0||amount>x.amount-x.paid)return alert('Invalid amount');x.paid+=amount;(x.payments??=[]).push({date:v.date,amount});save();closeModal();render()}
function exportLedger(){let r=ledger(),k=['date','source','reference','description','account','debit','credit'];download(k.join(',')+'\n'+r.map(x=>k.map(y=>'"'+String(x[y]??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'technestus-general-ledger.csv','text/csv')}

// Monthly analytics: aggregates the same posted double-entry ledger used by Accounting.
function analyticsNav(){if(!canView('analytics'))return;document.getElementById('nav').insertAdjacentHTML('beforeend',`<button class="${page==='analytics'?'active':''}" onclick="go('analytics')">▥ Monthly analytics</button>`)}
const navBeforeAnalytics=nav;nav=function(){navBeforeAnalytics();analyticsNav()};
const renderBeforeAnalytics=render;render=function(){if(!sessionUser)return;if(page==='analytics'){nav();return analyticsPage()}renderBeforeAnalytics()};
let analyticsYear=new Date().getFullYear();
const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthlyDataset(year){let months=monthNames.map((month,i)=>({month,index:i,revenue:0,expenses:0,profit:0,cashIn:0,cashOut:0,investorCapital:0,repayments:0,eggsSet:0,hatched:0,mortality:0,salesCount:0}));
 for(let l of ledger()){let d=String(l.date||'');if(!/^\d{4}-\d{2}/.test(d)||Number(d.slice(0,4))!==year)continue;let m=months[Number(d.slice(5,7))-1];if(!m)continue;let type=acctMap[l.account]?.[2];if(type==='Income')m.revenue+=Number(l.credit||0)-Number(l.debit||0);if(type==='Expense')m.expenses+=Number(l.debit||0)-Number(l.credit||0);if(['1000','1010'].includes(l.account)){m.cashIn+=Number(l.debit||0);m.cashOut+=Number(l.credit||0)} }
 for(let r of db.investments){let d=String(r.receivedDate||'');if(d.slice(0,4)===String(year)&&months[Number(d.slice(5,7))-1])months[Number(d.slice(5,7))-1].investorCapital+=Number(r.principal||0)}

<!-- TECHNESTUS HATCHERY COUNTDOWN AND REMINDERS -->
<script>

(function () {
  "use strict";

  const DAY_MS = 24 * 60 * 60 * 1000;
  const REMINDER_KEY = "technestus_hatch_alerts_v1";

  function dateOnly(value) {
    if (!value) return null;
    const parts = String(value).slice(0, 10).split("-").map(Number);
    if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) {
      return null;
    }
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    if (
      d.getFullYear() !== parts[0] ||
      d.getMonth() !== parts[1] - 1 ||
      d.getDate() !== parts[2]
    ) return null;
    return d;
  }

  function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function daysUntil(date) {
    const now = new Date();
    const today = new Date(
      now.getFullYear(), now.getMonth(), now.getDate()
    );
    return Math.round((date - today) / DAY_MS);
  }

  function formatDate(date) {
    return date.toLocaleDateString("en-KE", {
      day: "numeric",
      month: "short",
      year: "numeric"
    });
  }

  function countdownText(days, action) {
    if (days > 0) return days + " day(s) remaining";
    if (days === 0) return "TODAY - " + action;
    return Math.abs(days) + " day(s) overdue";
  }

  function getActiveBatches() {
    if (typeof db === "undefined" || !Array.isArray(db.hatches)) {
      return [];
    }

    return db.hatches
      .filter(batch => batch.setDate && !(Number(batch.hatched) > 0))
      .map(batch => {
        const setDate = dateOnly(batch.setDate);
        if (!setDate) return null;

        const transfer = addDays(setDate, 18);
        const hatch = addDays(setDate, 21);

        return {
          batch,
          transfer,
          hatch,
          transferDays: daysUntil(transfer),
          hatchDays: daysUntil(hatch)
        };
      })
      .filter(item => item && daysUntil(dateOnly(item.batch.setDate)) <= 0 && item.hatchDays >= 0)
      .sort((a, b) => a.hatch - b.hatch);
  }

  function renderCountdown() {
    if (typeof page === "undefined" || page !== "dashboard") return;
    if (typeof sessionUser === "undefined" || !sessionUser) return;

    const main = document.getElementById("main");
    if (!main) return;

    let panel = document.getElementById("technestusCountdown");

    if (!panel) {
      panel = document.createElement("div");
      panel.id = "technestusCountdown";
      panel.className = "panel";
      main.appendChild(panel);
    }

    const batches = getActiveBatches();

    let html = `
      <h3>🐣 Live Incubation Countdown</h3>
      <p class="muted">
        Automatic day-18 transfer and day-21 hatching reminders
      </p>
      <button type="button" onclick="enableHatchAlerts()">
        🔔 Enable Browser Notifications
      </button>
      <div style="margin-top:15px">
    `;

    if (!batches.length) {
      html += `<p class="muted">No active incubation batches.</p>`;
    }

    batches.forEach(item => {
      const b = item.batch;
      const setDate = dateOnly(b.setDate);
const elapsedDays = -daysUntil(setDate);
const currentDay = Math.min(21, Math.max(1, elapsedDays + 1));
const progress = Math.min(100, Math.round(currentDay / 21 * 100));

let stage = "Early incubation";

if (currentDay >= 8 && currentDay <= 14) {
  stage = "Embryo development";
} else if (currentDay >= 15 && currentDay <= 17) {
  stage = "Preparing for transfer";
} else if (currentDay === 18) {
  stage = "Transfer day";
} else if (currentDay >= 19 && currentDay <= 20) {
  stage = "Final incubation";
} else if (currentDay === 21) {
  stage = "Expected hatch day";
}
      const safe = typeof esc === "function"
        ? esc
        : value => String(value ?? "").replace(/[&<>"']/g, "");

      const transferColor = item.transferDays <= 0
        ? "#b45309" : "#287a54";
      const hatchColor = item.hatchDays <= 0
        ? "#b45309" : "#287a54";

      html += `
        <div style="
          border:1px solid #e6e3db;
          border-left:5px solid #c99b38;
          border-radius:10px;
          padding:15px;
          margin-bottom:12px;
          background:#fff;
        ">
          <h3 style="margin-bottom:8px">
            🥚 Batch: ${safe(b.batch || b.id || "Unnamed")}
          </h3>

          <p><b>Incubator:</b> ${safe(b.machine || "Not specified")}</p>
          <p><b>Eggs set:</b> ${Number(b.eggsSet || 0)}</p>
          <p><b>Set date:</b> ${formatDate(dateOnly(b.setDate))}</p>

<div style="
  background:#f7f5ef;
  padding:15px;
  border-radius:10px;
  margin:12px 0;
">
  <h3 style="color:#252525">
    🐣 Incubation Day ${currentDay} of 21
  </h3>

  <p><b>Stage:</b> ${stage}</p>

  <div style="
    width:100%;
    height:16px;
    background:#e5e5e5;
    border-radius:10px;
    overflow:hidden;
  ">
    <div style="
      width:${progress}%;
      height:100%;
      background:#c99b38;
      border-radius:10px;
    "></div>
  </div>

  <p>
    <b>${progress}%</b> of incubation timeline completed
  </p>
</div>


          <div style="
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
            gap:12px;
          ">
            <div style="background:#fff8e6;padding:12px;border-radius:8px">
              <b>🔄 Day 18 - Egg Transfer</b>
              <p>${formatDate(item.transfer)}</p>
              <strong style="color:${transferColor}">
                ${countdownText(item.transferDays, "TRANSFER EGGS")}
              </strong>
            </div>

            <div style="background:#edf8f0;padding:12px;border-radius:8px">
              <b>🐣 Day 21 - Expected Hatch</b>
              <p>${formatDate(item.hatch)}</p>
              <strong style="color:${hatchColor}">
                ${countdownText(item.hatchDays, "EXPECTED HATCH")}
              </strong>
            </div>
          </div>
        </div>
      `;
    });

    html += `</div>`;
    panel.innerHTML = html;
  }

  function checkReminders() {
    if (typeof sessionUser === "undefined" || !sessionUser) return;
    if (!("Notification" in window)) return;
    if (Notification.permission !== "granted") return;

    const batches = getActiveBatches();
    const currentDate = new Date().toLocaleDateString("en-CA");
    const userId = String(sessionUser.id || "user");

    let sent = {};
    try {
      sent = JSON.parse(localStorage.getItem(REMINDER_KEY) || "{}");
    } catch (_) {}

    batches.forEach(item => {
      const b = item.batch;
      const batchId = String(b.id || b.batch || b.setDate);
      const events = [
        {
          days: item.transferDays,
          type: "transfer",
          title: "Technestus - Transfer Eggs Today",
          body: `Batch ${b.batch || batchId}: transfer eggs to the hatcher.`
        },
        {
          days: item.hatchDays,
          type: "hatch",
          title: "Technestus - Hatch Day",
          body: `Batch ${b.batch || batchId}: chicks are expected to hatch today.`
        }
      ];

      events.forEach(event => {
        const key = `${userId}:${batchId}:${event.type}:${currentDate}`;

        if (event.days !== 0 || sent[key]) return;

        try {
          new Notification(event.title, {
            body: event.body,
            icon: "/images/technestus-logo.jpeg",
            tag: key
          });
          sent[key] = true;
        } catch (err) {
          console.warn("Notification unavailable:", err);
        }
      });
    });

    localStorage.setItem(REMINDER_KEY, JSON.stringify(sent));
  }

  window.enableHatchAlerts = async function () {
    if (!("Notification" in window)) {
      alert("This browser does not support notifications.");
      return;
    }

    try {
      const permission = await Notification.requestPermission();

      if (permission === "granted") {
        alert("Technestus hatchery browser alerts enabled.");
        checkReminders();
      } else {
        alert("Notification permission was not granted.");
      }
    } catch (err) {
      alert("Unable to enable notifications on this browser.");
    }
  };

  // Add the countdown after the existing dashboard renders.
  if (typeof dashboard === "function") {
    const existingDashboard = dashboard;

    dashboard = function (main) {
      existingDashboard(main);
      renderCountdown();
      checkReminders();
    };
  }

  // Refresh without replacing other dashboard content.
  setInterval(function () {
    renderCountdown();
    checkReminders();
  }, 60000);

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
       renderCountdown();
      checkReminders();
    }
  });

})();
</script>

<!-- TECHNESTUS COMMUNICATION CENTER -->
<script>
(function () {
  "use strict";

  const STORAGE_KEY = "technestus_communication_v1";

  const channels = [
    ["general", "General Team"],
    ["hatchery", "Hatchery Team"],
    ["brooding", "Brooding Team"],
    ["sales", "Sales Team"],
    ["announcements", "Admin Announcements"]
  ];

  let selectedChannel = "general";

  function currentUser() {
    return typeof sessionUser !== "undefined"
      ? sessionUser
      : null;
  }

  function isAdmin() {
    const user = currentUser();

    if (!user) return false;

    return [
      "admin",
      "super_admin",
      "superadmin",
      "owner"
    ].includes(
      String(user.role || "")
        .toLowerCase()
        .replace(/\s+/g, "_")
    );
  }

  function userName() {
    const user = currentUser() || {};

    return String(
      user.name ||
      user.fullName ||
      user.email ||
      user.username ||
      user.id ||
      "Employee"
    );
  }

  function escapeText(value) {
    return String(value ?? "").replace(
      /[&<>"']/g,
      character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character])
    );
  }

  function getMessages() {
    try {
      const data = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );

      return Array.isArray(data) ? data : [];
    } catch (error) {
      return [];
    }
  }

  function saveMessages(messages) {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(messages)
    );
  }

  function showCommunication() {
    const main = document.getElementById("main");

    if (!main) return;

    const messages = getMessages().filter(
      message => message.channel === selectedChannel
    );

    const channelButtons = channels.map(
      ([id, title]) => `
        <button
          type="button"
          class="${selectedChannel === id ? "" : "secondary"}"
          onclick="technestusOpenChannel('${id}')"
          style="margin:5px"
        >
          ${escapeText(title)}
        </button>
      `
    ).join("");

    const messageHistory = messages.length
      ? messages.map(message => `
          <div style="
            padding:14px;
            border-bottom:1px solid #e5e0d4;
          ">
            <div style="
              display:flex;
              justify-content:space-between;
              gap:12px;
              flex-wrap:wrap;
            ">
              <strong>
                ${escapeText(message.sender)}
              </strong>

              <small class="muted">
                ${escapeText(
                  new Date(message.time).toLocaleString("en-KE")
                )}
              </small>
            </div>

            <p style="
              white-space:pre-wrap;
              overflow-wrap:anywhere;
              margin-top:8px;
            ">
              ${escapeText(message.text)}
            </p>
          </div>
        `).join("")
      : `<p class="muted">
           No messages yet. Start a conversation.
         </p>`;

    const announcementsLocked =
      selectedChannel === "announcements" && !isAdmin();

    main.innerHTML = `
      <div class="head">
        <div>
          <h2>💬 Communication Center</h2>
          <p class="muted">
            Technestus Investment Farm
          </p>
        </div>
      </div>

      <div class="panel">
        <h3>Team Communication</h3>

        <p class="muted">
          Select a department to view its messages.
        </p>

        <div style="
          display:flex;
          flex-wrap:wrap;
          gap:5px;
        ">
          ${channelButtons}
        </div>
      </div>

      <div class="panel">
        <h3>
          ${escapeText(
            channels.find(
              channel => channel[0] === selectedChannel
            )?.[1] || "Messages"
          )}
        </h3>

        <div style="
          min-height:180px;
          max-height:420px;
          overflow-y:auto;
          background:#faf9f6;
          border-radius:8px;
          padding:12px;
        ">
          ${messageHistory}
        </div>
      </div>

      <div class="panel">
        <h3>
          ${announcementsLocked
            ? "Admin announcements"
            : "Send a Message"}
        </h3>

        ${announcementsLocked
          ? `<p class="muted">
               Only administrators can publish announcements.
             </p>`
          : `
            <form onsubmit="technestusSendMessage(event)">
              <div class="field">
                <label>Message</label>

                <textarea
                  name="message"
                  rows="4"
                  maxlength="3000"
                  required
                  placeholder="Write your message here..."
                  style="width:100%;padding:12px"
                ></textarea>
              </div>

              <div class="toolbar" style="margin-top:15px">
                <button type="submit">
                  Send Message
                </button>
              </div>
            </form>
          `}
      </div>

      <div class="note">
        Messages in this version are saved in the
        current browser only. They are not yet
        delivered to other devices.
      </div>
    `;
  }

  window.technestusOpenChannel = function (channelId) {
    if (!channels.some(channel => channel[0] === channelId)) {
      return;
    }

    selectedChannel = channelId;
    showCommunication();
  };

  window.technestusSendMessage = function (event) {
    event.preventDefault();

    if (!currentUser()) {
      alert("Please log in first.");
      return;
    }

    if (
      selectedChannel === "announcements" &&
      !isAdmin()
    ) {
      alert("Only administrators can send announcements.");
      return;
    }

    const messageText = String(
      event.target.elements.message.value || ""
    ).trim();

    if (!messageText) return;

    const messages = getMessages();

    messages.push({
      id: Date.now().toString(),
      channel: selectedChannel,
      sender: userName(),
      text: messageText,
      time: new Date().toISOString()
    });

    try {
      saveMessages(messages);
      showCommunication();
    } catch (error) {
      alert("Unable to save your message.");
    }
  };

  // Add Communication to existing sidebar
  const originalNav = nav;

  nav = function () {
    originalNav();

    if (!currentUser()) return;

    const sidebar = document.getElementById("nav");

    if (!sidebar) return;

    if (!sidebar.querySelector("#communicationNav")) {
      const button = document.createElement("button");

      button.id = "communicationNav";
      button.type = "button";
      button.textContent = "💬 Communication";

      if (page === "communication") {
        button.classList.add("active");
      }

      button.onclick = function () {
        page = "communication";
        render();
      };

      sidebar.appendChild(button);
    }
  };

  // Connect Communication to existing renderer
  const originalRender = render;

  render = function () {
    if (page === "communication") {
      if (!currentUser()) return;

      nav();
      showCommunication();
      return;
    }

    return originalRender();
  };

})();
</script>
<!-- END TECHNESTUS COMMUNICATION CENTER -->


<!-- TECHNESTUS AUTOMATIC DOCUMENT PRINTING -->
<script>
(function () {
  "use strict";

  function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));
  }

  function money(value) {
    return "KSh " + Number(value || 0).toLocaleString(
      "en-KE",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 }
    );
  }

  function date(value) {
    if (!value) return "Not specified";
    const d = new Date(String(value).slice(0, 10) + "T12:00:00");
    return Number.isNaN(d.getTime())
      ? safe(value)
      : d.toLocaleDateString("en-KE", {
          day: "numeric",
          month: "long",
          year: "numeric"
        });
  }

  function row(label, value) {
    return `<tr>
      <th>${safe(label)}</th>
      <td>${safe(value)}</td>
    </tr>`;
  }

  function moneyRow(label, value) {
    return row(label, money(value));
  }

  function signatures(left, right) {
    return `
      <div class="signatures">
        <div>
          <h3>${safe(left)}</h3>
          <p>Name: __________________________</p>
          <p>Signature: ______________________</p>
          <p>Date: __________________________</p>
        </div>
        <div>
          <h3>${safe(right)}</h3>
          <p>Name: __________________________</p>
          <p>Signature: ______________________</p>
          <p>Date: __________________________</p>
        </div>
      </div>
    `;
  }

  function printDocument(title, content) {
    const popup = window.open("", "_blank");

    if (!popup) {
      alert("Please allow pop-ups to print documents.");
      return;
    }

    popup.document.open();
    popup.document.write(`<!doctype html>

  }

  function findRecord(type, id) {
    return (db[type] || []).find(
      record => String(record.id) === String(id)
    );
  }

  // 1. INVESTMENT AGREEMENT
  window.printInvestmentAgreement = function (id) {
    const a = findRecord("investments", id);
    if (!a) return alert("Agreement not found.");

    const investor = (db.investors || []).find(
      x => x.investorId === a.investorId
    );

    const html = `
      <p>
        This document records the investment arrangement
        between Technestus Investment Farm and the investor
        identified below, subject to the agreed terms.
      </p>

      <table>
        ${row("Agreement Number", a.agreementId)}
        ${row("Investor Name", investor?.name || a.investorId)}
        ${row("Investor ID", a.investorId)}
        ${row("Investor Contact", investor?.phone || "")}
        ${moneyRow("Investment Capital", a.principal)}
        ${row("Date Capital Received", date(a.receivedDate))}
        ${row("Interest Calculation", a.interestType)}
        ${row("Agreed Interest Value / Rate", a.interestValue)}
        ${moneyRow("Calculated Interest", a.interest)}
        ${moneyRow("Total Payable", a.totalPayable)}
        ${row("Repayment Period (Months)", a.termMonths)}
        ${row("Final Due Date", date(a.dueDate))}
        ${row("Repayment Frequency", a.frequency)}
        ${moneyRow("Current Outstanding Balance", a.outstanding)}
      </table>

      <h3>Repayment Schedule</h3>
      <div class="terms">${safe(a.schedule || "As agreed by both parties.")}</div>

      <h3>Additional Agreement Terms</h3>
      <div class="terms">${safe(a.notes || "No additional terms recorded.")}</div>

      <p>
        By signing below, the parties acknowledge that
        they have reviewed this document and agree to
        the recorded investment terms.
      </p>

      ${signatures(
        "Investor",
        "Technestus Authorized Representative"
      )}
    `;

    printDocument("Investment Agreement", html);
  };

  // 2. INVESTOR REPAYMENT ACKNOWLEDGEMENT
  window.printRepaymentAcknowledgement = function (id) {
    const p = findRecord("repayments", id);
    if (!p) return alert("Repayment not found.");

    const agreement = (db.investments || []).find(
      a => a.agreementId === p.agreementId
    );

    const investor = (db.investors || []).find(
      x => x.investorId === agreement?.investorId
    );

    const html = `
      <p>
        This document acknowledges the repayment
        recorded against the investment agreement
        identified below.
      </p>

      <table>
        ${row("Payment Reference", p.paymentId)}
        ${row("Agreement Number", p.agreementId)}
        ${row("Investor", investor?.name || agreement?.investorId || "")}
        ${row("Payment Date", date(p.date))}
        ${row("Payment Method", p.method)}
        ${moneyRow("Principal Repaid", p.principalPaid)}
        ${moneyRow("Interest Repaid", p.interestPaid)}
        ${moneyRow("Total Payment", p.amount)}
        ${moneyRow("Agreement Outstanding Balance", agreement?.outstanding)}
      </table>

      <h3>Payment Notes</h3>
      <div class="terms">${safe(p.notes || "No additional notes.")}</div>

      <p>
        The signatures below acknowledge the payment
        details recorded above. This acknowledgement
        does not replace independent payment evidence.
      </p>

      ${signatures(
        "Investor / Payment Recipient",
        "Technestus Authorized Representative"
      )}
    `;

    printDocument("Investor Repayment Acknowledgement", html);
  };

  // 3. SUCCESSFUL HATCH REPORT
  window.printHatchReport = function (id) {
    const h = findRecord("hatches", id);
    if (!h) return alert("Hatch batch not found.");

    if (!(Number(h.hatched) > 0)) {
      return alert("No successfully hatched chicks recorded.");
    }

    const eggs = Number(h.eggsSet || 0);
    const chicks = Number(h.hatched || 0);
    const failed = Math.max(0, eggs - chicks);
    const rate = eggs > 0 ? (chicks / eggs * 100).toFixed(1) : "0.0";

    const html = `
      <table>
        ${row("Egg Batch ID", h.batch)}
        ${row("Breed", h.breed)}
        ${row("Incubator", h.machine)}
        ${row("Incubation Start", date(h.setDate))}
        ${row("Day 18 Transfer", date(h.transferDate))}
        ${row("Expected Hatch Date", date(h.hatchDate))}
        ${row("Eggs Set", eggs)}
        ${row("Successfully Hatched Chicks", chicks)}
        ${row("Eggs Not Recorded as Hatched", failed)}
        ${row("Hatch Rate", rate + "%")}
      </table>

      <h3>Production Notes</h3>
      <div class="terms">${safe(h.notes || "No notes recorded.")}</div>

      <p>
        This report summarizes the recorded hatchery
        production results for the specified batch.
      </p>

      ${signatures(
        "Hatchery Officer",
        "Farm Supervisor"
      )}
    `;

    printDocument("Hatchery Production Report", html);
  };

  // 4. INVOICE
  window.printFarmInvoice = function (id) {
    const x = findRecord("invoices", id);
    if (!x) return alert("Invoice not found.");

    const html = `
      <table>
        ${row("Invoice Number", x.number)}
        ${row("Customer", x.customer)}
        ${row("Invoice Date", date(x.date))}
        ${row("Due Date", date(x.dueDate))}
        ${row("Product / Service", x.item)}
        ${row("Quantity", x.quantity)}
        ${moneyRow("Unit Price", x.unitPrice)}
        ${moneyRow("Discount", x.discount)}
        ${moneyRow("Total Invoice Amount", x.amount)}
        ${row("Status", x.status)}
      </table>

      <h3>Notes</h3>
      <div class="terms">${safe(x.notes || "Thank you for your business.")}</div>
    `;

    printDocument("Customer Invoice", html);
  };

  // 5. RECEIPT
  window.printFarmReceipt = function (id) {
    const x = findRecord("receipts", id);
    if (!x) return alert("Receipt not found.");

    const html = `
      <table>
        ${row("Receipt Number", x.number)}
        ${row("Customer", x.customer)}
        ${row("Payment Date", date(x.date))}
        ${row("Related Invoice", x.invoice)}
        ${row("Payment Method", x.method)}
        ${row("Transaction Reference", x.reference)}
        ${moneyRow("Amount Received", x.amount)}
      </table>

      <p>Thank you for your payment.</p>
    `;

    printDocument("Payment Receipt", html);
  };

  // 6. ACCOUNTING / FINANCIAL REPORT
  window.printFarmFinancialReport = function () {
    if (typeof ledger !== "function" ||
        typeof balances !== "function") {
      return alert("Accounting module is unavailable.");
    }

    const records = ledger();
    const accountBalances = balances();

    const entries = typeof ACCOUNT_LIST !== "undefined"
      ? ACCOUNT_LIST.map(([code, name, type]) => {
          const b = accountBalances[code] || {};
          const net = Number(b.debit || 0) -
                      Number(b.credit || 0);

          return `<tr>
            <td>${safe(code)}</td>
            <td>${safe(name)}</td>
            <td>${safe(type)}</td>
            <td>${money(Math.max(0, net))}</td>
            <td>${money(Math.max(0, -net))}</td>
          </tr>`;
        }).join("")
      : "";

    const debitTotal = records.reduce(
      (s, r) => s + Number(r.debit || 0), 0
    );

    const creditTotal = records.reduce(
      (s, r) => s + Number(r.credit || 0), 0
    );

    const html = `
      <p>Report generated: ${date(new Date().toISOString())}</p>
      <p>Currency: Kenya Shillings (KSh)</p>

      <h3>General Ledger Summary / Trial Balance</h3>

      <table>
        <tr>
          <th>Code</th>
          <th>Account</th>
          <th>Type</th>
          <th>Debit</th>
          <th>Credit</th>
        </tr>
        ${entries}
      </table>

      <table>
        ${moneyRow("Total Ledger Debits", debitTotal)}
        ${moneyRow("Total Ledger Credits", creditTotal)}
        ${row("Ledger Entries", records.length)}
      </table>

      <div class="terms">
        This is a provisional management report generated
        from recorded ERP transactions. It is not an
        audited financial statement.
      </div>

      ${signatures(
        "Prepared By",
        "Reviewed / Approved By"
      )}
    `;

    printDocument("Accounting Financial Report", html);
  };

  // 7. ADD PRINT BUTTONS TO EXISTING TABLES
  function addPrintButtons() {
    const main = document.getElementById("main");
    if (!main) return;

    const configurations = {
      investments: {
        records: db.investments,
        action: "printInvestmentAgreement",
        label: "Print Agreement"
      },
      repayments: {
        records: db.repayments,
        action: "printRepaymentAcknowledgement",
        label: "Print & Sign"
      },
      hatches: {
        records: db.hatches,
        action: "printHatchReport",
        label: "Print Hatch Report"
      },
      invoices: {
        records: db.invoices,
        action: "printFarmInvoice",
        label: "Print Invoice"
      },
      receipts: {
        records: db.receipts,
        action: "printFarmReceipt",
        label: "Print Receipt"
      }
    };

    if (configurations[page]) {
      const config = configurations[page];
      const rows = main.querySelectorAll("tbody tr");
      const records = [...config.records].reverse();

      records.forEach((record, index) => {
        const tr = rows[index];
        if (!tr) return;

        if (page === "hatches" &&
            !(Number(record.hatched) > 0)) {
          return;
        }

        const cell = tr.lastElementChild;
        if (!cell) return;

        if (cell.querySelector(".technestus-print-btn")) {
          return;
        }

        const button = document.createElement("button");
        button.type = "button";
        button.className = "secondary technestus-print-btn";
        button.textContent = "🖨 " + config.label;
        button.style.margin = "4px";

        button.onclick = () => {
          window[config.action](record.id);
        };

        cell.appendChild(button);
      });
    }

    if (page === "accounting" || page === "reports") {
      const toolbar = main.querySelector(".head .toolbar") ||
                      main.querySelector(".head");

      if (toolbar &&
          !toolbar.querySelector(".technestus-report-print")) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "technestus-report-print";
        button.textContent = "🖨 Print Financial Report";
        button.onclick = window.printFarmFinancialReport;
        toolbar.appendChild(button);
      }
    }
  }

  // Preserve existing ERP rendering
  const previousRender = render;

  render = function () {
    const result = previousRender.apply(this, arguments);
    addPrintButtons();
    return result;
  };

})();
</script>
